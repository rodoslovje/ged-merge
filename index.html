<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/app-icon-32.png" />
    <link rel="apple-touch-icon" href="icons/app-icon-180.png" />
    <meta name="theme-color" content="#151310" />
    <title>GED Merge — GEDCOM merge, compare &amp; edit</title>
    <meta name="description" content="Merge, compare and edit GEDCOM genealogy files side-by-side — resolve conflicts field by field, normalize places and dates, and find duplicates. Free, private, 100% in-browser." />
    <link rel="canonical" href="https://gedmerge.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gedmerge.com/" />
    <meta property="og:title" content="GED Merge — GEDCOM merge, compare &amp; edit" />
    <meta property="og:description" content="Merge, compare and edit GEDCOM genealogy files side-by-side — resolve conflicts field by field, normalize places and dates, and find duplicates. Free, private, 100% in-browser." />
    <meta property="og:image" content="https://gedmerge.com/gedmerge-green.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:site_name" content="GED Merge" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GED Merge — GEDCOM merge, compare &amp; edit" />
    <meta name="twitter:description" content="Merge, compare and edit GEDCOM genealogy files side-by-side — resolve conflicts field by field, normalize places and dates, and find duplicates. Free, private, 100% in-browser." />
    <meta name="twitter:image" content="https://gedmerge.com/gedmerge-green.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "GED Merge",
      "url": "https://gedmerge.com/",
      "description": "Merge, compare and edit GEDCOM genealogy files side-by-side. Resolve conflicts field by field, normalize places and dates, and find duplicates. Free, private, 100% in-browser.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires a modern web browser with JavaScript enabled",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Compare two GEDCOM files side-by-side",
        "Merge records with field-level conflict resolution",
        "Edit individual and family records",
        "Find and merge within-file duplicates",
        "Normalize place names and date formats",
        "Kinship-distance ranking of matches",
        "User Guide with usage instructions",
        "No upload — all data stays in your browser"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "GED Merge",
      "url": "https://gedmerge.com/"
    }
    </script>
    <script>
      // Set the theme before first paint to avoid a flash: saved choice, else
      // the OS preference. Kept in sync with React in App.tsx.
      (function () {
        try {
          var saved = localStorage.getItem("gedmerge.theme");
          var theme = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>
        GED Merge is a free, in-browser GEDCOM editor — edit, compare and merge family-tree files,
        with maintenance tools for health checks, duplicates, normalization, sources and places.
        Learn how it works in the
        <a href="/guide/">User's Guide</a> (<a href="/navodila/" hreflang="sl">Slovenščina</a>).
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
