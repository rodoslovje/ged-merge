name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run main again by hand — to put the test site back on the newest main.
  workflow_dispatch:

jobs:
  check:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Runs the unit suite and enforces the per-directory coverage floors.
      - run: npm run test:coverage

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: check
    # ~3 min locally at full speed; a 2-core shared runner with retries is
    # well inside this. Without it a hung server holds the job for GitHub's
    # 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Chromium runs the full suite; WebKit only the @smoke-tagged tests
      # (see the projects in playwright.config.ts).
      - run: npx playwright install --with-deps chromium webkit

      - run: npm run build

      - run: npm run test:e2e
        env:
          CI: true

      # The service worker exists only in the production build: offline start
      # and the update prompt, against `vite preview` of the dist/ built above.
      - run: npx playwright test -c playwright.pwa.config.ts
        env:
          CI: true

  # Every green push to main goes to the test site on GitHub Pages
  # (test.gedmerge.com). Production is released by hand with the
  # "Deploy production" workflow.
  deploy-test:
    name: Deploy test site
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # A newer push waits for the running deploy rather than cancelling it
    # halfway.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # Two merges close together run side by side, and the older one's
      # tests can finish last: its deploy then ran after the newer one and put
      # the site back on a main without the newer merge. Deploys run one at a
      # time (the group above), so a run whose commit main has already moved
      # past leaves the site to the newer run.
      - id: latest
        name: Deploy only the newest main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has moved on to $head; that commit's own run deploys it."
          fi

      - if: steps.latest.outputs.ok == 'true'
        uses: actions/checkout@v7

      - if: steps.latest.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.latest.outputs.ok == 'true'
        run: npm ci

      - if: steps.latest.outputs.ok == 'true'
        run: npm run build

      # The pages keep their canonical links to gedmerge.com; this keeps the
      # test copy out of the search index altogether.
      - name: Keep the test site out of search engines
        if: steps.latest.outputs.ok == 'true'
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          rm -f dist/sitemap.xml

      - if: steps.latest.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        if: steps.latest.outputs.ok == 'true'
        uses: actions/deploy-pages@v5
