name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run main again by hand — to put the test site back on the newest main.
  workflow_dispatch:

jobs:
  check:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    outputs:
      # The e2e jobs run in the Playwright image of exactly this version.
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - run: npm run lint

      - run: npm run typecheck

      # Runs the unit suite and enforces the per-directory coverage floors.
      - run: npm run test:coverage

  # The browsers come preinstalled in Microsoft's Playwright image, matched to
  # the version in package-lock.json. `playwright install --with-deps` used to
  # fetch WebKit's ~200 system packages from the runner's Ubuntu mirror on
  # every run: 2 minutes on a good day, 8 or 19 on a slow mirror, and once a
  # hang that ran out the job's timeout.
  #
  # Chromium runs the full suite in three shards side by side; WebKit runs the
  # @smoke-tagged tests (see the projects in playwright.config.ts) and the
  # service-worker specs, which need the production build.
  e2e-shard:
    name: E2E ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: check
    # A shard takes ~4 min; without a bound a hung server holds the job for
    # GitHub's 6-hour default.
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.check.outputs.playwright }}-noble
      # The runner's own user, so the checkout and caches stay writable;
      # Chromium wants the host's shared memory.
      options: --user 1001 --ipc=host
    strategy:
      # Every shard runs to the end, so one failure shows all the others.
      fail-fast: false
      matrix:
        include:
          - { name: chromium 1/3, args: --project=chromium --shard=1/3 }
          - { name: chromium 2/3, args: --project=chromium --shard=2/3 }
          - { name: chromium 3/3, args: --project=chromium --shard=3/3 }
          - { name: webkit + PWA, args: --project=webkit, pwa: true }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx playwright test ${{ matrix.args }}
        env:
          CI: true

      # The service worker exists only in the production build: offline start
      # and the update prompt, against `vite preview` of dist/.
      - if: matrix.pwa
        run: npm run build

      - if: matrix.pwa
        run: npx playwright test -c playwright.pwa.config.ts
        env:
          CI: true

  # The one check the ruleset on main requires: green only when every shard is.
  e2e:
    name: E2E (Playwright)
    if: always()
    needs: e2e-shard
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.e2e-shard.result }}" = success

  # Every green push to main goes to the test site on GitHub Pages
  # (test.gedmerge.com). Production is released by hand with the
  # "Deploy production" workflow.
  deploy-test:
    name: Deploy test site
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # A newer push waits for the running deploy rather than cancelling it
    # halfway.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # Two merges close together run side by side, and the older one's
      # tests can finish last: its deploy then ran after the newer one and put
      # the site back on a main without the newer merge. Deploys run one at a
      # time (the group above), so a run whose commit main has already moved
      # past leaves the site to the newer run.
      - id: latest
        name: Deploy only the newest main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has moved on to $head; that commit's own run deploys it."
          fi

      - if: steps.latest.outputs.ok == 'true'
        uses: actions/checkout@v7

      - if: steps.latest.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.latest.outputs.ok == 'true'
        run: npm ci

      - if: steps.latest.outputs.ok == 'true'
        run: npm run build

      # The pages keep their canonical links to gedmerge.com; this keeps the
      # test copy out of the search index altogether.
      - name: Keep the test site out of search engines
        if: steps.latest.outputs.ok == 'true'
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          rm -f dist/sitemap.xml

      - if: steps.latest.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # deploy-pages looks the artifact up by name the moment it starts, and
      # on 24. 11. 2026 the list was still empty a second after the upload had
      # finished ("Found 0 artifact(s)"), four runs in a row. Wait until the
      # artifact is listed — a minute at most, then let the deploy say what
      # is wrong.
      - name: Wait for the uploaded site to be listed
        if: steps.latest.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 20); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length' 2>/dev/null || echo 0)
            if [ "$n" -ge 1 ]; then exit 0; fi
            sleep 3
          done
          echo "::warning::the github-pages artifact is still not listed after a minute"

      - id: deployment
        if: steps.latest.outputs.ok == 'true'
        uses: actions/deploy-pages@v5
